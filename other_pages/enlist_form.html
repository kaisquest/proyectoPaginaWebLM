<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="/ProyectoFinalTrimestre/stylesheet.css" type="text/css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alistate con nosotros</title>
</head>

<body>
    <main>
        <div>
            <img class="britonNeedsYou" src="/ProyectoFinalTrimestre/img/Briton_needs_you.jpg"
                alt="Imagen de un cartel propagandístico de la época que dice 'Briton Needs You' que arenga al reclutamiento voluntario">
        </div>
        <section>
            <h2 class="tituloFormulario">Alístate con nosotros</h2>
            <form action="" method="post">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Michael Collins" required><br>

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="michaelcollins@ejemplomail.com" required><br>

                <label for="nacionalidad">Nacionalidad</label>
                <input type="text" id="nombre" name="nacionalidad" placeholder="Irlandés"><br>

                <label for="interes">Por favor, indique su situación laboral</label>
                <select name="Situación actual" required>
                    <option value="Empleado">Empleado</option>
                    <option value="Estudiante">Estudiante</option>
                    <option value="Parado">Parado</option>
                    <option value="ParadoLarg">Parado de larga duración</option>
                    <option value="Jubilado">Jubilado</option>
                    <option value="Otro">Otro</option>
                </select>

                <label for="interes">Qué es lo que más te interesa de nuestra asociación</label>

                <textarea id="interes" name="interes" rows="4"
                    placeholder="El tratamiento que hacéis de la historia social"></textarea>


                <label for="LOPD">Estoy de acuerdo con el tratamiento de mis datos</label>
                <input class="checkbox" type="checkbox" id="datos" id="LODP" value="ok" required>


                <input class="botonFormulario" type="submit" id="enviar" id="enviar" value="Enviar información">

            </form>


        </section>
    </main>

</body>

</html>
